######################################
# Connexion au serveur de messagerie #
######################################

smtp:
  hostname: "mailserver.org"
  port: 587 # optionnel, 587 par défaut
imap:
  hostname: "imap.mailserver.org" # optionnel, si non renseigné on utilisera le même serveur que pour smtp si copie dans la boîte d'envoi
  port: 143 # optionnel si on n'utilise pas la copie dans la boîte d'envoi, 143 par défaut si besoin
  sent_folder: "Sent" # optionnel si on ne copie pas dans la boîte d'envoi, `Sent` par défaut si besoin
username: "username"
password: "xxx" # optionnel, le mdp sera alors demandé à chaque utilisation
sender_email: "username@mailserver.com" # optionnel, si non renseigné on utilisera le username
sender_name: "L'Esprit de Noël" # optionnel, si non renseigné on utilisera le username 
copy_to_sent_folder: true # optionnel, par défaut vaut true
body_text_format: "auto" # optionnel, par défaut vaut "auto" et a valeur dans {auto, txt, html}