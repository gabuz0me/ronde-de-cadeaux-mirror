#######################
# Liste des personnes #
#######################

# Chaque nouvelle personne s'ajoute dans `people`.
# Ce qui arrive avant les deux-points sera son identifiant dans le tirage, et doit être unique entre toutes les personnes.
# Il est obligatoire de mettre le champ `email` si l'outil est utilisé pour envoyer des mails.
# Le champ `display_name` est le nom à afficher dans les messages et le tirage, il n'est pas obligatoire.
# C'est utile pour les noms longs ou composés ou avec trop de caractères spéciaux :
# pour se référer à la personne dans l'outil et dans ce fichier on utilise son identifiant,
# mais lors de l'affichage on utilisera bien son nom à afficher.
# Si ce champ n'est pas créé, l'identifiant sera utilisé comme nom à afficher.
# Le champ `nickname` permet d'ajouter un surnom. Pareillement, il n'est pas obligatoire.
# S'il n'est pas renseigné, on utilisera dans les messages d'abord le nom à afficher, et s'il n'existe pas
# non plus son identifiant.

people:

  Alice:
    display_name: Alice-Andréa-Alexia Foo
    email: alice@foo.me
    denylist:
    - Bob
    - Foo siblings
    
  Bob:
    display_name: Bœbælius Foo
    nickname: Bob Foo
    email: bob@foo.me
    denylist:
    - Alice
    - Foo siblings

  Carol Foo:
    display_name: Cärol Foo
    email: carol@foo.me
    denylist:
    - Foo siblings

  Dave Foo:
    email: dave@foo.me
    allowlist:
    - cousins
    denylist:
    - Foo siblings

  Eve Bar:
    email: eve@bar.me
    denylist:
    - Flora Bar
    - Bar siblings

  Flora Bar:
    nickname: Flo Bar
    email: flora@bar.me
    denylist:
    - Eve Bar
    - Bar siblings

  Gulliver Bar:
    email: gulliver@bar.me
    denylist:
    - Bar siblings

  Henry Bar:
    email: henry@bar.me
    allowlist:
    - cousins
    denylist:
    - Bar siblings

  Isobel Bar:
    display_name: Isöbel Bar
    email: isobel@bar.me
    allowlist:
    - cousins
    denylist:
    - Bar siblings

  Jack Baz:
    email: jack@baz.me

  Linda Qux:
    email: linda@qux.me
    denylist:
    - Qux polycule

  Mark Qux:
    email: mark@qux.me
    denylist:
    - Qux polycule

  Nick Qux:
    email: nick@qux.me
    denylist:
    - Qux polycule

##########################
# Liste des sous-groupes #
##########################

# Les groupes servent à définir des contraintes.
# Pour ajouter un groupe, il faut créer comme ci-dessous un groupe avec un identifiant unique.
# Chaque groupe peut référencer des personnes (en utilisant leurs identifiants) ou d'autres groupes
# (en utilisant également leurs identifiant).

groups:

  Foo siblings:
  - Carol Foo
  - Dave Foo

  Bar siblings:
  - Gulliver Bar
  - Henry Bar
  - Isobel Bar

  Qux polycule:
  - Linda Qux
  - Mark Qux
  - Nick Qux

  cousins:
  - Foo siblings
  - Bar siblings
