#######################
# Liste des personnes #
#######################

# Chaque nouvelle personne s'ajoute dans `people`.
# Ce qui arrive avant les deux-points sera son identifiant dans le tirage, et doit être unique entre toutes les personnes.
# Il est obligatoire de mettre le champ `email` si l'outil est utilisé pour envoyer des mails.
# Le champ `display_name` est le nom à afficher dans les messages et le tirage, il n'est pas obligatoire.
# C'est utile pour les noms longs ou composés ou avec trop de caractères spéciaux :
# pour se référer à la personne dans l'outil et dans ce fichier on utilise son identifiant,
# mais lors de l'affichage on utilisera bien son nom à afficher.
# Si ce champ n'est pas créé, on utilisera l'identifiant comme nom à afficher.
# le champ `nickname` permet d'ajouter un surnom. Pareillement, il n'est pas obligatoire.
# S'il n'est pas renseigné, on utilisera dans les messages d'abord le nom à afficher, et s'il n'existe pas
# non plus son identifiant.

people:
  alice_foo:
    display_name: "Alice-Andréa-Alexia Foo"
    email: "alice@foo.me"
    denylist: ["Bob Foo"]
    denylist_clusters: ["Foo siblings"]

  bob_foo:
    display_name: "Bœbælius Foo"
    nickname: "Bob Foo"
    email: "bob@foo.me"
    denylist: ["Alice Foo"]
    denylist_clusters: ["Foo siblings"]

  Carol Foo:
    display_name: "Cärol Foo"
    email: "carol@foo.me"
    denylist_clusters: ["Foo siblings"]

  Dave Foo:
    email: "dave@foo.me"
    allowlist_clusters: ["cousins"]
    denylist_clusters: ["Foo siblings"]

  Eve Bar:
    email: "eve@bar.me"
    denylist: ["Flora Bar"]
    denylist_clusters: ["Bar siblings"]

  Flora Bar:
    nickname: "Flo Bar"
    email: "flora@bar.me"
    denylist: ["Eve Bar"]
    denylist_clusters: ["Bar siblings"]

  Gulliver Bar:
    email: "gulliver@bar.me"
    denylist_clusters: ["Bar siblings"]

  Henry Bar:
    email: "henry@bar.me"
    allowlist_clusters: ["cousins"]
    denylist_clusters: ["Bar siblings"]

  Isobel Bar:
    display_name: "Isöbel Bar"
    email: "isobel@bar.me"
    allowlist_clusters: ["cousins"]
    denylist_clusters: ["Bar siblings"]

  Jack Baz:
    email: "jack@baz.me"

  Linda Qux:
    email: "linda@qux.me"
    denylist_clusters: ["Qux polycule"]

  Mark Qux:
    email: "mark@qux.me"
    denylist_clusters: ["Qux polycule"]

  Nick Qux:
    email: "nick@qux.me"
    denylist_clusters: ["Qux polycule"]


##########################
# Liste des sous-groupes #
##########################

# Les clusters servent à définir des contraintes.
# Pour ajouter un cluster, il faut créer comme ci-dessous un cluster avec un identifiant unique.
# Chaque cluster peut référencer des personnes (en utilisant leurs identifiants) ou d'autres clusters
# (en utilisant également leurs identifiant).
# Il faudra créer un champ `people` pour référencer des personnes et `subclusters` pour référencer d'autres clusters.

clusters:
  Foo siblings:
    people: ["Carol Foo", "Dave Foo"]
  Bar siblings:
    people: ["Gulliver Bar", "Henry Bar", "Isobel Bar"]
  Qux polycule:
    people: ["Linda Qux", "Mark Qux", "Nick Qux"]
  cousins:
    subclusters: ["Foo siblings", "Bar siblings"]
