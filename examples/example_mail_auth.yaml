#############################
# Connexion au serveur mail #
#############################

hostname: "mailserver.org"
port_smtp: 587 # optionnel, 587 par défaut
hostname_imap: "imap.mailserver.org" # optionnel, si non renseigné on utilisera le même serveur que pour smtp si copie dans la boîte d'envoi
port_imap: 143 # optionnel si on n'utilise pas la copie dans la boîte d'envoi, 143 par défaut si besoin
username: "username"
password: "xxx" # optionnel, le mdp sera alors demandé à chaque utilisation
sender_mail: "email_address" # optionnel, si non renseigné on utilisera le username 
sender_name: "The Invisible Hand of the Draw" # optionnel, si non renseigné on utilisera le username 
sent_folder: "Sent" # optionnel si on ne copie pas dans la boîte d'envoi, `Sent` par défaut si besoin
