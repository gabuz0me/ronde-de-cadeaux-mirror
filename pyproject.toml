[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ronde-de-cadeaux"
version = "0.0.0dev2"
authors = [{ name = "Adrien Laporte", email = "adrien.laporte@posteo.net" }]
description = "Random Draw for your Secret Santa"
readme = "PyPI.md"
requires-python = ">=3.12"
license = "CECILL-2.1"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Communications :: Email",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pyyaml",                                              # pour les fichiers de config
    "dacite",                                              # dict vers dataclass
    "email-validator",                                     # syntaxe et dns
    "colorlog",                                            # de la couleur dans le logger
    "i18nparse@git+https://github.com/gabuz0me/i18nparse", # argparse traduit
]


[dependency-groups]
dev = [
    "babel",  # i18n
    "build",  # construction du whl tout ça
    "cogapp", # création de la partie --help du readme
    "twine",  # téléversement sur PyPI
]
quality = [
    "basedpyright", # static type checker ( mais basé 8-) )
    "ruff",         # formatter
]

[project.scripts]
ronde = "ronde_de_cadeaux.cli:main"

[project.urls]
Homepage = "https://framagit.org/gabuzome/ronde-de-cadeaux/"
Documentation = "https://framagit.org/gabuzome/ronde-de-cadeaux/-/blob/main/README.md"
GitLab = "https://framagit.org/gabuzome/ronde-de-cadeaux/"
GitHub = "https://github.com/gabuz0me/ronde-de-cadeaux-mirror/"
Changelog = "https://framagit.org/gabuzome/ronde-de-cadeaux/-/blob/main/Changelog.md"

[tool.setuptools]
packages = ["ronde_de_cadeaux"]
[tool.setuptools.package-data]
ronde_de_cadeaux = ["locale/**/*.mo"]

# Ruff

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = [
    "ANN", # flake8-annotations
    "D",   # pydocstyle
    "DOC", # pydoclint
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "INT",
]
ignore = [
    "ANN204", # Missing return type annotation for special method `__init__`
    "D105",   # Missing docstring in magic method
    "D418",   # No docstrings in @overload decorated functions
    "E741",   # Ambiguous variable name
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN201", # Missing return type annotation for public function
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
]

# BasedPyright

[tool.basedpyright]
pythonVersion = "3.12"
reportAny = false
reportAttributeAccessIssue = false
reportExplicitAny = false
reportMissingTypeStubs = false
reportUnannotatedClassAttribute = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnusedCallResult = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = false
